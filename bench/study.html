<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Console</title>
<!-- Page for `bench console` at /study (bench/console.py, bench/study.py). It walks one participant
     through a task day: interview, the chat with each agent, the questions after each, the blind
     comparison, the day's extra questions and the agents' process reports. The questions come from
     tasks/<folder>/study.json, which is private and kept out of git. -->
<style>
:root {
  --bg: #f5f5f2; --surface: #fff; --surface-2: #efeeea; --border: #e2e0da;
  --text: #1c1c1a; --muted: #66655f; --faint: #97958d;
  --accent: #2d56c9; --accent-text: #fff; --accent-soft: #e8eefc;
  --ok: #1f8a4c; --ok-soft: #e3f4ea; --warn: #8a5a00; --warn-soft: #fff4d6; --danger: #b8402c; --danger-soft: #fbe9e5;
  --agent: #f0efe9; --shadow: 0 1px 2px rgba(20,20,15,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141413; --surface: #1d1d1b; --surface-2: #262623; --border: #33332f;
    --text: #ecebe6; --muted: #a3a29b; --faint: #75746d;
    --accent: #7d9bff; --accent-text: #0e1220; --accent-soft: #1f2843;
    --ok: #5cc98a; --ok-soft: #173325; --warn: #f0c060; --warn-soft: #3a2e12; --danger: #f08a75; --danger-soft: #3d1f19;
    --agent: #262623; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #141413; --surface: #1d1d1b; --surface-2: #262623; --border: #33332f;
  --text: #ecebe6; --muted: #a3a29b; --faint: #75746d;
  --accent: #7d9bff; --accent-text: #0e1220; --accent-soft: #1f2843;
  --ok: #5cc98a; --ok-soft: #173325; --warn: #f0c060; --warn-soft: #3a2e12; --danger: #f08a75; --danger-soft: #3d1f19;
  --agent: #262623; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
.top { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
.top h1 { font-size: 16px; margin: 0; font-weight: 650; }
.top .who { color: var(--muted); font-size: 13px; }
.top .grow { flex: 1; }
.saved { font-size: 12px; color: var(--muted); }
.saved.err { color: var(--danger); }
.layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 24px; max-width: 1180px; margin: 0 auto; padding: 20px; }
.rail { position: sticky; top: 70px; align-self: start; }
.rail .grp { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin: 14px 0 4px; }
.rail button { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 7px; cursor: pointer; color: var(--muted); font-size: 14px; }
.rail button .tick { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border); flex: none; display: grid; place-items: center; font-size: 10px; }
.rail button.done .tick { background: var(--ok); border-color: var(--ok); color: #fff; }
.rail button.here { background: var(--accent-soft); color: var(--text); font-weight: 600; }
.rail button.here .tick { border-color: var(--accent); }
.rail button:disabled { opacity: .45; cursor: default; }
main { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px; box-shadow: var(--shadow); }
.panel + .panel { margin-top: 16px; }
.kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin-bottom: 6px; }
h2 { font-size: 22px; line-height: 1.3; margin: 0 0 8px; font-weight: 650; }
h3 { font-size: 15px; margin: 0 0 8px; }
.help { color: var(--muted); margin: 0 0 14px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--border); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--faint); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }
.progress { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; margin: 0 0 18px; }
.progress > div { height: 100%; background: var(--accent); transition: width .2s; }
.opts { display: grid; gap: 8px; margin: 6px 0 4px; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1.5px solid var(--border); background: var(--surface); border-radius: 10px; padding: 10px 14px; cursor: pointer; }
.opt:hover { border-color: var(--faint); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt .t { font-weight: 600; }
.opt .d { color: var(--muted); font-size: 13px; }
.opt .ex { color: var(--faint); font-size: 13px; font-style: italic; margin-top: 4px; }
.cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cards .opt { flex-direction: column; gap: 2px; padding: 14px 16px; }
.cards .num { font-size: 12px; color: var(--faint); }
textarea, input[type=text], input[type=number], input:not([type]), select { width: 100%; border: 1.5px solid var(--border); border-radius: 9px; background: var(--surface); padding: 9px 11px; }
textarea { min-height: 120px; resize: vertical; }
textarea:focus, input:focus, select:focus { outline: none; border-color: var(--accent); }
.voice { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
.mic { display: inline-flex; gap: 6px; align-items: center; border: 1.5px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-size: 14px; }
.mic .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--danger); opacity: .35; }
.mic.on { border-color: var(--danger); color: var(--danger); }
.mic.on .dot { opacity: 1; animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.voice .note { font-size: 12px; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 11px; font-size: 13px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.statusbox { margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--border); }
.statusbox .lbl { font-size: 13px; color: var(--muted); }
.probe { margin-top: 16px; padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); }
.probe .lbl { font-size: 12px; color: var(--warn); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.nav { display: flex; gap: 10px; margin-top: 22px; align-items: center; }
.err { color: var(--danger); font-size: 13px; }
.scale { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; margin-top: 6px; }
.scale button { border: 1.5px solid var(--border); background: var(--surface); border-radius: 9px; padding: 10px 0; cursor: pointer; font-weight: 600; }
.scale button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
.scale-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
table.grid { width: 100%; border-collapse: collapse; font-size: 14px; }
table.grid th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 4px 6px; }
table.grid td { padding: 4px 6px; vertical-align: top; }
table.grid input, table.grid select { padding: 6px 8px; }
.budget { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.budget label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.cardview { display: grid; gap: 2px; }
.cardview .f { display: grid; grid-template-columns: 190px minmax(0, 1fr) auto; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--border); align-items: start; }
.cardview .f:last-child { border-bottom: 0; }
.cardview .k { font-size: 13px; color: var(--muted); }
.cardview .v { white-space: pre-wrap; }
.tag { display: inline-block; font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.tag.firm { background: var(--danger-soft); color: var(--danger); }
.tag.preference { background: var(--accent-soft); color: var(--accent); }
.tag.open, .tag.dont_know { background: var(--warn-soft); color: var(--warn); }
.banner { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); margin-bottom: 14px; font-size: 14px; }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.bad { background: var(--danger-soft); color: var(--danger); }
/* Chat */
.chatgrid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 16px; }
.chatpane { display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 520px; padding: 0; overflow: hidden; }
.chathead { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.timer { font-variant-numeric: tabular-nums; font-weight: 650; font-size: 18px; }
.timer.warn { color: var(--warn); } .timer.bad { color: var(--danger); }
.turns { font-size: 13px; color: var(--muted); }
.msgs { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 82%; padding: 9px 13px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 4px; }
.msg.agent { align-self: flex-start; background: var(--agent); border-bottom-left-radius: 4px; }
.msg .meta { display: block; font-size: 11px; opacity: .7; margin-top: 4px; }
.msg.me a { color: inherit; }
.stepmark { align-self: center; font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .05em; }
.compose { border-top: 1px solid var(--border); padding: 12px 16px; display: grid; gap: 8px; }
.compose textarea { min-height: 70px; }
.side .panel { padding: 16px; }
.side h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.side ul { padding-left: 18px; margin: 0; font-size: 13px; color: var(--muted); }
.side li + li { margin-top: 4px; }
.jobline { font-size: 12px; color: var(--muted); }
.handoffs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 8px; }
.handoffs .h { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; max-height: 420px; overflow-y: auto; white-space: pre-wrap; font-size: 14px; }
.handoffs .h b { display: block; margin-bottom: 6px; font-size: 13px; }
details > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
.files { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--muted); }
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 16px; }
  .rail { position: static; display: flex; gap: 6px; overflow-x: auto; }
  .rail .grp { display: none; }
  .rail button { width: auto; white-space: nowrap; }
  .chatgrid { grid-template-columns: minmax(0, 1fr); }
  .cards, .handoffs, .budget { grid-template-columns: minmax(0, 1fr); }
  .cardview .f { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .panel { padding: 16px; }
}
</style>
</head>
<body>
<header class="top">
  <h1>Study console</h1>
  <span class="who" id="who"></span>
  <span class="grow"></span>
  <span class="saved" id="saved"></span>
  <a class="small" href="/" id="console-link">Agent console</a>
  <button type="button" class="btn small" id="study-signout" hidden>Sign out</button>
</header>
<div class="layout">
  <nav class="rail" id="rail" aria-label="Steps"></nav>
  <main id="main"><div class="panel">Loading…</div></main>
</div>

<script>
(() => {
  const TOKEN = (() => { try { return __CONSOLE_TOKEN__; } catch (e) { return null; } })();
  const HOSTED = (() => { try { return __HOSTED_STUDY__; } catch (e) { return false; } })();
  const ONLINE = HOSTED || (typeof TOKEN === 'string' && !!TOKEN);
  const POLL_MS = 2000;
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const words = s => String(s || '').trim().split(/\s+/).filter(Boolean).length;
  const filled = v => v != null && v !== '' && !(Array.isArray(v) && !v.length) && !(typeof v === 'object' && !Array.isArray(v) && !Object.values(v).some(x => x !== '' && x != null && x !== false));
  const localIso = iso => { if (!iso) return iso; const d = new Date(iso); if (isNaN(d)) return iso; const off = -d.getTimezoneOffset(); const p = n => String(Math.abs(n)).padStart(2, '0');
    return new Date(d.getTime() + off * 60000).toISOString().slice(0, 23) + (off >= 0 ? '+' : '-') + p(Math.floor(Math.abs(off) / 60)) + ':' + p(Math.abs(off) % 60); };
  const nowIso = () => { const d = new Date(Date.now() + clockOffset); const off = -d.getTimezoneOffset(); const p = n => String(Math.abs(n)).padStart(2, '0');
    return new Date(d.getTime() + off * 60000).toISOString().slice(0, 23) + (off >= 0 ? '+' : '-') + p(Math.floor(Math.abs(off) / 60)) + ':' + p(Math.abs(off) % 60); };
  const clock = iso => iso ? new Date(iso).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  const local = { get(k) { try { return JSON.parse(localStorage.getItem('study.' + k)); } catch (e) { return null; } },
                  set(k, v) { try { localStorage.setItem('study.' + k, JSON.stringify(v)); } catch (e) {} } };

  let spec = null;           // the task's questions and messages (tasks/<folder>/study.json)
  let S = null;              // this participant's state, saved as progress.json
  let agentsAvail = [];      // agents the console can send to
  let snap = null, snapVersion = null, jobs = [], dryRun = false, clockOffset = 0;
  let polling = null;
  let saveTimer = null, saving = 0, saveErr = '';
  let cloudWrites = Promise.resolve();
  const pendingWrites = new Map(), submissions = new Map();

  function cloudSave(key, body) {
    pendingWrites.set(key, body);
    saving++; showSaved();
    cloudWrites = cloudWrites.then(async () => {
      if (pendingWrites.get(key) !== body) return;
      try {
        await api('/api/study/save', body);
        if (pendingWrites.get(key) === body) pendingWrites.delete(key);
        if (!pendingWrites.size) saveErr = '';
        S.savedAt = new Date().toISOString();
      } catch (error) {
        saveErr = error.message;
      }
    }).finally(() => { saving--; showSaved(); });
    return cloudWrites;
  }

  // MARK: Server

  async function api(path, body) {
    if (HOSTED) return studyAuth.api(path, body);
    if (!ONLINE) throw new Error('not connected to bench console');
    const r = await fetch(path, { method: body ? 'POST' : 'GET', cache: 'no-store',
      headers: { 'X-Console-Token': TOKEN, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined });
    let out = {};
    try { out = await r.json(); } catch (e) {}
    if (!r.ok) throw new Error(out.error || `the console answered ${r.status}`);
    return out;
  }

  function showSaved() {
    const el = $('saved');
    el.classList.toggle('err', !!saveErr);
    el.textContent = saveErr ? `Not saved ${HOSTED ? 'to the study server' : 'to disk'}: ${saveErr}${HOSTED ? '' : ' (kept in this browser)'}` : saving ? 'Saving…' : S && S.savedAt ? `Saved ${clock(S.savedAt)}` : '';
  }

  // Writes one of the participant's files. Everything is also kept in this browser, so nothing is lost offline.
  async function saveFile(path, payload) {
    if (!S) return;
    if (HOSTED) {
      const body = JSON.parse(JSON.stringify({ pid: S.pid, path, ...payload }));
      if (body.append) body.append = body.append.map(record => ({ ...record, event_id: crypto.randomUUID() }));
      return cloudSave(body.append && body.append.length ? body.append[0].event_id : path, body);
    }
    local.set(`${S.pid}.${path}`, payload);
    if (!ONLINE) { saveErr = 'offline'; showSaved(); return; }
    saving++; showSaved();
    try {
      await api('/api/study/save', { pid: S.pid, path, ...payload });
      saveErr = ''; S.savedAt = new Date().toISOString();
    } catch (e) { saveErr = e.message; }
    saving--; showSaved();
  }
  function saveProgress(now) {
    if (!S) return;
    if (!HOSTED) local.set(`${S.pid}.progress`, S);
    clearTimeout(saveTimer);
    const go = () => {
      saveTimer = null;
      return saveFile('progress.json', { data: { task: S.task, day: S.day, stage: S.stage, state: S } });
    };
    if (now) return go();
    saveTimer = setTimeout(go, 700);
  }

  // MARK: Spec helpers

  const cardOf = id => (spec.cards || []).find(c => c.id === id);
  const fieldOf = id => (spec.fields || []).find(f => f.id === id);
  const preQs = () => spec.pre.flatMap(st => st.questions.map(q => ({ ...q, _step: st.id })));
  const D = () => { const d = String(S.day); S.d = S.d || {}; return (S.d[d] = S.d[d] || { chats: {}, after: {}, comparison: {}, wyd: {}, learning: {}, process: {}, done: {} }); };
  const order = () => S.day === 1 ? S.session.day1_order : S.session.day2_order;
  const labelOf = agent => { const bl = (S.session.blind_labels || {})[String(S.day)] || {}; return bl.A === agent ? 'A' : bl.B === agent ? 'B' : '?'; };
  const agentOfLabel = l => ((S.session.blind_labels || {})[String(S.day)] || {})[l];
  const stepName = (kind, n) => `DAY ${S.day} ${kind}${n != null ? ' ' + n : ''}`;

  function effectiveCard() { const A = S.pre.answers; return A.card === 'none' ? A.closest_card : A.card; }

  function cond(c, A, X) {
    if (!c) return true;
    if (c.all) return c.all.every(x => cond(x, A, X));
    if (c.any) return c.any.some(x => cond(x, A, X));
    if (c.not) return !cond(c.not, A, X);
    if ('card' in c) return X.card === c.card;
    if ('answered' in c) return filled(A[c.answered]);
    if ('top_status' in c) return X.topStatus === c.top_status;
    if ('has_open' in c) return !!(X.openDecisions && X.openDecisions.length) === c.has_open;
    const v = A[c.q];
    if ('eq' in c) return v === c.eq;
    if ('ne' in c) return v !== c.ne;
    if ('in' in c) return c.in.includes(v);
    if ('lte' in c) return typeof v === 'number' && v <= c.lte;
    if ('gte' in c) return typeof v === 'number' && v >= c.gte;
    if ('has_any' in c) return Array.isArray(v) && v.some(x => c.has_any.includes(x));
    if ('ne_q' in c) return filled(v) && filled(A[c.ne_q]) && v !== A[c.ne_q];
    return true;
  }
  function qText(q, A, X) {
    let t = q.text || '';
    if (q.text_by) { const hit = q.text_by.find(v => cond(v.when, A, X)); if (hit) t = hit.text; }
    return t.replace(/\{(\w+)\}/g, (m, k) => { const v = X[k] != null ? X[k] : A[k]; return v == null || v === '' ? '…' : Array.isArray(v) ? v.join(', ') : String(v); });
  }
  function optLabel(q, v) { const o = (q.options || []).find(o => o.value === v); return o ? o.label : v; }

  function fmt(q, v) {
    if (!filled(v)) return '';
    switch (q.type) {
      case 'single': case 'abtie': return optLabel(q, v);
      case 'cards': return v === 'none' ? (q.none_option || 'None') : (cardOf(v) || {}).title || v;
      case 'multi': return v.map(x => optLabel(q, x)).join(', ');
      case 'confirm': return q.confirm || 'Yes';
      case 'scale7': return v === 'unable_to_judge' ? 'Unable to judge' : `${v} of 7`;
      case 'people': return v.filter(p => p.alias).map(p => `${p.alias} (${[p.role, p.confirmed ? 'confirmed' : 'not confirmed yet', p.relation].filter(Boolean).join(', ')})`).join('; ');
      case 'budget': {
        const cur = v.currency || 'USD', sym = cur === 'USD' ? '$' : cur + ' ';
        const range = v.amount_low && v.amount_high ? `${sym}${v.amount_low}–${v.amount_high}` : v.amount_low ? `from ${sym}${v.amount_low}` : v.amount_high ? `up to ${sym}${v.amount_high}` : '';
        return [range && `${range}${v.per ? ' per ' + v.per : ''}`, v.firm_limit ? `firm limit ${sym}${v.firm_limit}${v.per ? ' per ' + v.per : ''}` : 'no firm limit', v.note].filter(Boolean).join('; ');
      }
      case 'sources': return v.map(s => `${s.detail || '?'} — ${s.agent || 'either agent'} via ${s.source || '?'} (${s.access_verified === 'yes' ? 'verified' : 'not verified'})`).join('; ');
      default: return String(v);
    }
  }

  // Pre-task: which questions the participant's answers lead to, and what each card field says
  function preCtx(withTop = true) {
    const A = S.pre.answers, card = effectiveCard(), c = cardOf(card);
    const X = { card, card_title: c ? c.title : '', card_title_lower: c ? c.title.toLowerCase() : 'gathering' };
    if (withTop && A.top_pref) { X.topStatus = fieldStatus(A.top_pref); X.top_pref_label = topPrefLabel(A.top_pref); }
    return X;
  }
  function visiblePre(stepId) {
    const X = preCtx(false), A = S.pre.answers;

  }
  function fieldQs(fid) { return visiblePre().filter(q => q.field === fid); }
  function fieldStatus(fid) {
    const ov = (S.pre.answers.__override || {})[fid];
    if (ov && ov.status) return ov.status;
    const A = S.pre.answers, qs = fieldQs(fid);
    const set = qs.filter(q => q.status && A[q.id + '__status']).map(q => A[q.id + '__status']);

  }
  function fieldAnswer(fid) {
    const ov = (S.pre.answers.__override || {})[fid];
    if (ov && filled(ov.answer)) return ov.answer;
    const A = S.pre.answers, parts = [];
    fieldQs(fid).forEach((q, i) => {
      const v = fmt(q, A[q.id]);
      if (v) parts.push(i === 0 && !q.label ? v : `${q.label || shortQ(q)}: ${v}`);
      if (q.probe && filled(A[q.id + '__probe'])) parts.push(`${q.probe.text} ${A[q.id + '__probe']}`);

    return parts.join('\n');
  }
  const shortQ = q => (q.text || '').replace(/\{.*?\}/g, '').split(/[?.]/)[0].slice(0, 60);
  function fieldAlternative(fid) { const A = S.pre.answers; const alts = fieldQs(fid).map(q => A[q.id + '__alt']).filter(filled); return alts.length ? alts.join('\n') : null; }
  function topPrefLabel(fid) { const f = fieldOf(fid); const a = fieldAnswer(fid).split('\n').map(x => x.replace(/^[^:]{1,40}: /, '')).filter(x => !/^(yes|no)$/i.test(x)).join('; '); return f ? `${f.label.split(':')[0].toLowerCase()}: ${a.slice(0, 90)}${a.length > 90 ? '…' : ''}` : fid; }
  function openDecisions() { return (spec.fields || []).filter(f => fieldStatus(f.id) === 'open').map(f => f.label.split(':')[0].toLowerCase()); }

  // MARK: Stages

  function stages() {
    const list = [{ key: 'setup', title: 'Session', group: 'Start' }];
    if (!S.session || !S.session.agents) return list;
    if (S.day === 1) spec.pre.forEach(st => list.push({ key: 'pre:' + st.id, title: st.title, group: 'Pre-task interview' }));
    else list.push({ key: 'reread', title: 'Anything changed?', group: 'Pre-task' });
    order().forEach((a, i) => {
      const n = order().length > 1 ? `Agent ${labelOf(a)}` : a.charAt(0).toUpperCase() + a.slice(1);
      list.push({ key: 'chat:' + (i + 1), title: `Chat with ${n}`, group: 'Task' });
      list.push({ key: 'after:' + (i + 1), title: `About ${n}`, group: 'Task' });
    });
    if (order().length > 1) list.push({ key: 'compare', title: 'Compare A and B', group: 'Post-task' });
    if (S.day === 1) list.push({ key: 'day1', title: 'What you would really do', group: 'Post-task' });
    else order().forEach((a, i) => list.push({ key: 'learn:' + (i + 1), title: `Learning check: Agent ${labelOf(a)}`, group: 'Post-task' }));
    list.push({ key: 'process', title: 'Process reports', group: 'Post-task' });
    list.push({ key: 'done', title: 'Finished', group: 'Post-task' });

  }
  const isDone = key => key === 'setup' ? !!(S.session && S.session.agents && (S.session.blind_labels || {})[String(S.day)]) : key.startsWith('pre:') ? !!(S.pre.done || {})[key] : !!D().done[key];
  function reachable(key) {
    const list = stages(); const i = list.findIndex(s => s.key === key);
    return i <= 0 || list.slice(0, i).every(s => isDone(s.key));
  }
  function go(key) { S.stage = key; stopPollingUnlessNeeded(); saveProgress(); render(); window.scrollTo(0, 0); }
  function completeStage(key) {
    if (key.startsWith('pre:')) S.pre.done = { ...(S.pre.done || {}), [key]: true }; else D().done[key] = true;
    const list = stages(); const i = list.findIndex(s => s.key === key);
    go(list[Math.min(i + 1, list.length - 1)].key);
  }

  function renderRail() {
    if (!S) { $('rail').innerHTML = ''; return; }
    let grp = '', out = '';
    for (const st of stages()) {
      if (st.group !== grp) { grp = st.group; out += `<div class="grp">${esc(grp)}</div>`; }
      out += `<button type="button" data-go="${esc(st.key)}" class="${S.stage === st.key ? 'here' : ''} ${isDone(st.key) ? 'done' : ''}" ${reachable(st.key) ? '' : 'disabled'}><span class="tick">${isDone(st.key) ? '✓' : ''}</span>${esc(st.title)}</button>`;
    }
    $('rail').innerHTML = out;
    $('who').textContent = S.session && S.session.agents ? `${S.pid} · Day ${S.day} · ${spec.title || S.task}` : S.pid || '';
  }

  function render() {
    renderRail(); showSaved();
    const m = $('main');
    if (!spec) return;
    if (!S) return renderStart(m);
    const key = S.stage || 'setup';
    if (key === 'setup') return renderSetup(m);
    if (key.startsWith('pre:')) return renderPre(m, key.slice(4));
    if (key === 'reread') return renderReread(m);
    if (key.startsWith('chat:')) return renderChat(m, +key.slice(5));
    if (key.startsWith('after:')) return renderAfter(m, +key.slice(6));
    if (key === 'compare') return renderCompare(m);
    if (key === 'day1') return renderDay1(m);
    if (key.startsWith('learn:')) return renderLearn(m, +key.slice(6));
    if (key === 'process') return renderProcess(m);
    if (key === 'done') return renderDone(m);
  }

  // MARK: Start and session

  async function renderStart(m) {
    let list = [];
    try { list = ONLINE ? (await api('/api/study/list')).participants : []; } catch (e) {}
    m.innerHTML = `<div class="panel">
      <div class="kicker">${esc(spec.title || spec.task)}</div>
      <h2>Who is taking part?</h2>
      <p class="help">Each participant has an ID like P001. Use the same ID on day 2 to pick up the same card.</p>
      <div class="row"><input id="pid" placeholder="P001" style="max-width:160px" autocomplete="off"><button class="btn primary" id="pid-go">Start or resume</button><span class="err" id="pid-err"></span></div>
      ${list.length ? `<h3 style="margin-top:22px">Resume</h3><div class="opts">${list.map(p => `<button class="opt" data-resume="${esc(p.pid)}"><span><span class="t">${esc(p.pid)}</span> <span class="d">day ${esc(p.day || '–')} · ${esc(p.stage || 'not started')} · updated ${esc(new Date(p.updated).toLocaleString())}</span></span></button>`).join('')}</div>` : ''}
      ${ONLINE ? '' : '<p class="banner">Not opened through <code>bench console</code>: answers stay in this browser (use “Download everything” at the end) and messages can’t be sent to agents.</p>'}
    </div>`;
    const start = async pid => {
      pid = (pid || '').trim().toUpperCase();

    };

  }

  async function openParticipant(pid) {
    let saved = null;
    if (HOSTED) {
      const result = await api('/api/study/load');
      saved = result.files['progress.json']?.state || null;
      for (const day of [1, 2]) {
        const submission = result.files[`day${day}/submission.json`];
        if (submission) submissions.set(day, submission);
      }
    }
    if (ONLINE && !HOSTED) { try { const r = await api('/api/study/load?pid=' + encodeURIComponent(pid)); saved = (r.files['progress.json'] || {}).state || null; } catch (e) {} }
    if (!HOSTED && !saved) saved = local.get(`${pid}.progress`);
    S = saved || { pid, task: spec.task, day: 1, stage: 'setup', session: { participant_id: pid }, pre: { answers: {}, done: {} }, d: {}, cursor: {} };
    S.cursor = S.cursor || {};
    render();
  }

  function renderSetup(m) {

  // MARK: Questionnaires

  // One question at a time. Branching: each question's `when` is checked against the answers so far.
  // A short answer to a question with a probe gets the probe once; "I don't know" is an answer.
  function renderQuestions(m, o) {
    // o: {scope, title, kicker, intro, list, A, X, readOnly, onDone(), doneLabel, audioPrefix}
    o.token = (o.token || 0) + 1;
    const visible = () => o.list.filter(q => cond(q.when, o.A, o.X()));
    let vis = visible();
    let cur = S.cursor[o.scope];
    let i = Math.max(0, vis.findIndex(q => q.id === cur));
    if (!vis.length) { m.innerHTML = '<div class="panel">Nothing to ask here.</div>'; return; }
    const q = vis[i], A = o.A, X = o.X();
    const text = qText(q, A, X);
    const pct = Math.round(100 * i / vis.length);
    m.innerHTML = `<div class="panel">
      <div class="kicker">${esc(o.kicker)} · ${i + 1} of ${vis.length}${o.minutes ? ` · about ${o.minutes} min for this part` : ''}</div>

      </div>

    const body = $('q-body');
    renderInput(body, q, A, o);
    const advance = () => {
      vis = visible();
      const j = vis.findIndex(x => x.id === q.id);
      const next = vis[j + 1];
      if (next) { S.cursor[o.scope] = next.id; saveProgress(); renderQuestions(m, o); window.scrollTo(0, 0); }
      else { saveProgress(); o.onDone(); }
    };

    $('q-next') && ($('q-next').onclick = next);

    $('q-dk') && ($('q-dk').onclick = () => { A[q.id + '__status'] = 'dont_know'; A[q.id + '__at'] = nowIso(); saveProgress(); advance(); });
    $('q-skip') && ($('q-skip').onclick = () => { A[q.id + '__skipped'] = true; advance(); });
    const first = body.querySelector('textarea, input');
    if (first && !o.readOnly && !('ontouchstart' in window)) first.focus();
  }
  function answeredEnough(q, v) {
    if (q.type === 'budget') return !!(v && (v.amount_low || v.amount_high || v.firm_limit) && v.per);

    if (q.type === 'sources') return Array.isArray(v) && v.some(s => s.detail);
    return filled(v);
  }

            <td><select data-p="confirmed" ${ro}><option value="no" ${!p.confirmed ? 'selected' : ''}>Still to ask</option><option value="yes" ${p.confirmed ? 'selected' : ''}>Confirmed</option></select></td>
